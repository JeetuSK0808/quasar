[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-malware"            # PyPI distribution name ("quasar" is taken); the command + import stay `quasar`
version = "0.6.0"
description = "Static malware analyzer that explains what a sample does, mapped to MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeetu SK" }]
keywords = ["malware", "security", "static-analysis", "mitre-attack", "pe", "mcp", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pefile>=2024.8.26",
    "rich>=13",
    "mcp>=1.0",
]

[project.optional-dependencies]
yara = ["yara-python>=4.5"]

[project.urls]
Homepage = "https://github.com/JeetuSK0808/quasar"
Repository = "https://github.com/JeetuSK0808/quasar"
Issues = "https://github.com/JeetuSK0808/quasar/issues"
Changelog = "https://github.com/JeetuSK0808/quasar/blob/main/CHANGELOG.md"

[project.scripts]
quasar = "quasar.cli:main"

[tool.setuptools]
packages = ["quasar"]

[tool.setuptools.package-data]
quasar = ["rules/*.yar", "rules/*.yara"]
